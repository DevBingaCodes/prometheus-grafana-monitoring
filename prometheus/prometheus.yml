global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
   - job_name: prometheus
     static_configs:
      - targets: ["localhost:9090"]
  
  # Node Exporter
   - job_name: linux-vps
     static_configs:
      - targets: ['172.18.0.2:9100']
  
  # Docker Monitoring
    # Docker monitoring
   - job_name: docker
     static_configs:
      - targets: ['cadvisor:8080']

  # Nginx monitoring
   - job_name: nginx
     static_configs:
      - targets: ['nginx-exporter:9113']
  
  # Telegraf
   - job_name: telegraf
     static_configs:
      - targets: ['host.docker.internal:9273']

  # Node Applications
  #Prestige Hostel API
   - job_name: 'prestige-hostel-local'
     metrics_path: /prestige-hostel/v1/metrics
     static_configs:
      - targets: ['host.docker.internal:5900'] #PM2 instance
     relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: localhost:5900  # Match what the dashboard expects
  
  # Murandi API
   - job_name: 'murandi-local'
     metrics_path: /murandi/v1/metrics
     static_configs:
      - targets: ['host.docker.internal:5700'] #PM2 instance
     relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: localhost:5700  # Match what the dashboard expects

  # Skirill Publication API
   - job_name: 'skirill-publication-local'
     metrics_path: /publication-site/v1/metrics
     static_configs:
      - targets: ['host.docker.internal:3000'] #PM2 instance
     relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: localhost:3000  # Match what the dashboard expects      


  